services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: movemate
      POSTGRES_DB: movemate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 5433 on the host: a native Postgres often already owns 5432
      - "5433:5432"
    volumes:
      - movemate-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movemate -d movemate"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  movemate-pgdata:
